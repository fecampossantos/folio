<script>
    document.addEventListener('DOMContentLoaded', () => {
        const sortButton = document.getElementById('sort-button');
        const sortDropdown = document.getElementById('sort-dropdown');

        sortButton.addEventListener('click', (e) => {
            e.stopPropagation();
            sortDropdown.classList.toggle('hidden');
        });

        document.addEventListener('click', () => {
            sortDropdown.classList.add('hidden');
        });

        // Soft ripple-like feedback for book cards
        const cards = document.querySelectorAll('.rounded-2xl');
        cards.forEach(card => {
            card.addEventListener('touchstart', () => {
                card.style.transform = 'scale(0.98)';
                card.style.transition = 'transform 0.2s ease-out';
            });
            card.addEventListener('touchend', () => {
                card.style.transform = 'scale(1)';
            });
        });

        // Dropdown selection logic
        const sortOptions = sortDropdown.querySelectorAll('button');
        sortOptions.forEach(option => {
            option.addEventListener('click', () => {
                sortButton.querySelector('span:first-child').innerText = option.innerText;
                sortDropdown.classList.add('hidden');
            });
        });
    });
</script>
